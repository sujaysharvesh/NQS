<div class="min-h-screen flex items-center justify-center bg-slate-50 font-['DM_Sans',sans-serif] p-6 relative overflow-hidden">
  
  <div class="absolute w-[500px] h-[500px] bg-blue-500/5 blur-3xl rounded-full -top-40 -right-40 pointer-events-none"></div>
  <div class="absolute w-[500px] h-[500px] bg-indigo-500/5 blur-3xl rounded-full -bottom-40 -left-40 pointer-events-none"></div>

  <div class="w-full max-w-[420px] relative z-10">
    <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100/80">
      
      <div class="text-center mb-8">
        <p class="text-sm text-slate-500">Sign in to your account to continue</p>
      </div>

      <div *ngIf="errorMessage" class="flex items-start gap-2.5 p-3.5 rounded-xl text-sm bg-red-50 text-red-600 border border-red-100/60 mb-6 animate-fadeIn">
        <i class="ti ti-alert-circle text-lg leading-none mt-0.5 flex-shrink-0"></i>
        <span class="font-medium">{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate autocomplete="off" class="space-y-5">
        
        <div>
          <p-floatlabel variant="on" class="block relative">
            <input
              pInputText
              id="email"
              type="text"
              formControlName="email"
              autocomplete="username"
              class="w-full px-4 py-3.5 text-sm text-slate-800 bg-white border border-slate-200 rounded-xl outline-none transition-all duration-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10"
              [class.!border-red-400]="f['email'].touched && f['email'].invalid"
            />
            <label for="email" class="text-slate-400 font-medium transition-all duration-200">Email address</label>
          </p-floatlabel>
          
          <div *ngIf="f['email'].touched && f['email'].errors as err" class="mt-1.5 text-xs text-red-500 flex items-center gap-1 px-1 animate-fadeIn">
            <i class="ti ti-info-circle text-[13px]"></i>
            <span *ngIf="err['required']">Email is required.</span>
            <span *ngIf="err['minlength']">Minimum 3 characters.</span>
          </div>
        </div>

        <div>
          <p-floatlabel variant="on" class="block relative">
            <input
              pInputText
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="w-full ltr:pl-4 ltr:pr-12 rtl:pr-4 rtl:pl-12 py-3.5 text-sm text-slate-800 bg-white border border-slate-200 rounded-xl outline-none transition-all duration-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10"
              [class.!border-red-400]="f['password'].touched && f['password'].invalid"
          
            />
            <label for="password" class="text-slate-400 font-medium transition-all duration-200">Password</label>
            
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all duration-200 z-10"
              aria-label="Toggle password visibility">
              <i class="ti text-lg flex" [ngClass]="showPassword ? 'ti-eye-off' : 'ti-eye'"></i>
            </button>
          </p-floatlabel>
          
          <div *ngIf="f['password'].touched && f['password'].errors as err" class="mt-1.5 text-xs text-red-500 flex items-center gap-1 px-1 animate-fadeIn">
            <i class="ti ti-info-circle text-[13px]"></i>
            <span *ngIf="err['required']">Password is required.</span>
            <span *ngIf="err['minlength']">Minimum 4 characters.</span>
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loading"
          class="w-full py-3.5 mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-sm rounded-xl transition-all duration-200 transform active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none shadow-sm shadow-blue-500/10">
          
          <ng-container *ngIf="!loading">
            <span class="flex items-center justify-center gap-1.5">
              Sign in 
              <i class="ti ti-arrow-right text-base transition-transform duration-200 group-hover:translate-x-0.5"></i>
            </span>
          </ng-container>
          
          <ng-container *ngIf="loading">
            <span class="flex items-center justify-center gap-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Signing in…
            </span>
          </ng-container>
        </button>

      </form>
      <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">
          Test Credentials
        </p>
      
        <div class="space-y-2 text-sm">
          <p><span class="font-semibold">Admin Email:</span> cd&#64;app.com</p>
          <p><span class="font-semibold">Admin Password:</span> admin123</p>
      
          <p class="pt-2"><span class="font-semibold">User Email:</span> bob&#64;app.com</p>
          <p><span class="font-semibold">User Password:</span> user123</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .animate-fadeIn {
    animation: fadeIn 0.2s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
